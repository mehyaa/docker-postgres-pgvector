name: Docker Publish

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

env:
  IMAGE_NAME: postgres-pgvector

jobs:
  resolve-pgvector-version:
    runs-on: ubuntu-latest

    outputs:
      ref: ${{ steps.latest.outputs.ref }}
      tag: ${{ steps.latest.outputs.tag }}

    steps:
      - name: Resolve latest stable pgvector version
        id: latest
        run: |
          latest_ref=$(git ls-remote --tags --refs https://github.com/pgvector/pgvector.git \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)

          echo "ref=${latest_ref}" >> "$GITHUB_OUTPUT"
          echo "tag=${latest_ref#v}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: resolve-pgvector-version

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        postgres:
          - 13
          - 14
          - 15
          - 16
          - 17
          - 18
        variant:
          - alpine
          - bookworm
          - trixie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta-latest
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}
          labels: >
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ github.actor }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.base.name=${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=false
            type=raw,value=${{ matrix.postgres }}-${{ matrix.variant }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.postgres }}/${{ matrix.variant }}
          file: ${{ matrix.postgres }}/${{ matrix.variant }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-latest.outputs.tags }}
          labels: ${{ steps.meta-latest.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.postgres }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.postgres }}-${{ matrix.variant }}
          provenance: false
          sbom: false

      - name: Extract metadata for Docker (pgvector Latest Tag)
        id: meta-tag
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.actor }}/${{ env.IMAGE_NAME }}
          labels: >
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ github.actor }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.base.name=${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=false
            type=raw,value=${{ matrix.postgres }}-${{ matrix.variant }}-${{ needs.resolve-pgvector-version.outputs.tag }}

      - name: Build and push Docker image (pgvector Latest Tag)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.postgres }}/${{ matrix.variant }}
          file: ${{ matrix.postgres }}/${{ matrix.variant }}/Dockerfile
          build-args: |
            PGVECTOR_VERSION=${{ needs.resolve-pgvector-version.outputs.ref }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-tag.outputs.tags }}
          labels: ${{ steps.meta-tag.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.postgres }}-${{ matrix.variant }}-stable
          cache-to: type=gha,mode=max,scope=${{ matrix.postgres }}-${{ matrix.variant }}-stable
          provenance: false
          sbom: false
